<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chess Bot Demo</title>

        <link rel="icon" href="assets/pieces/wk.svg" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="content-wrapper">
            <div id="game-option-wrapper">
                <div class="game-option-container">
                    <img class="game-option-thumbnail" src="./assets/player-vs-bot.png" onclick="window.open('game?mode=pvb', '_self')" draggable="false">
                    <button id="p-v-b-button" onclick="window.open('game?mode=pvb', '_self')">Player vs. Bot</button>
                </div>
                <div class="game-option-container">
                    <img class="game-option-thumbnail" src="./assets/player-vs-bot.png" onclick="window.open('game?mode=bvp', '_self')" draggable="false">
                    <button id="b-v-p-button" onclick="window.open('game?mode=bvp', '_self')">Bot vs. Player</button>
                </div>
            </div>
        </div>

        <div id="particles-js"></div>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
            integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
    </body>
</html>
