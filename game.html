<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Player vs. Bot</title>

        <link rel="icon" href="assets/pieces/wp.svg" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="content-wrapper">
            <div id="position-info">
                <span>Evaluation: <br><span id="eval">-</span></span>
                <span>Depth: <br><span id="depth">-</span></span>
                <span>Best move: <br><button id="show-best-move" style="display: none;" onclick="showBestMove()">Show</button><span id="best-move">-</span></span>
            </div>
            <div id="board">
                <!-- generated in JS -->
            </div>
            <div id="bot-info">
                <span id="bot-status" class="waiting-for-player">Waiting for player</span>
                <div id="post-game-div" style="display: none;"><button id="new-game" onclick="window.open('/', '_self')">New game</button></div>
            </div>
        </div>

        <div id="particles-js"></div>
        <script>
            let urlParams = new URLSearchParams(window.location.search);
            let mode = urlParams.get("mode");

            const humanColor = mode != null ? (mode === "bvp" ? "b" : "w") : "w";

            let icon = document.querySelector("link[rel='icon']");
            icon.href = humanColor === "b" ? "./assets/pieces/bp.svg" : "./assets/pieces/wp.svg";
        </script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
            integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"
            integrity="sha512-VMHB/Dy1/3d+djJPdMhxbplbZgbfPNHy+yWCxB1MSrwUEcNE+gnviL/DwlGsh9wwobnRTiQc6ChK2ZoJamshXA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/Draggable.min.js"
            integrity="sha512-NKBTx98DcUYKhGHhXXFKMQvDSMyUzF4rkWbi8IF/clwZnpvMOqyBaSIcyWGdVaRCLfpgaMIeA/zPoja+SYz0Ng=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script type="importmap">
            {
                "imports": {
                    "chess.js": "./node_modules/chess.js/dist/esm/chess.js"
                }
            }
        </script>
        <script src="index.js"></script>
        <script type="module" src="module.js"></script>
    </body>
</html>
